<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Netlify form detection</title></head>
<body>
  <form name="quote-request" method="POST" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="quote-request">
    <p><label>Bot field <input name="bot-field"></label></p>
    <input name="name" type="text">
    <input name="phone" type="tel">
    <input name="email" type="email">
    <select name="shipping_method"><option>Air Freight</option></select>
    <input name="origin" type="text">
    <input name="destination" type="text">
    <select name="cargo_type"><option>General Cargo</option></select>
    <select name="container_size"><option>Not applicable</option></select>
    <input name="container_number" type="text">
    <input name="tonnage" type="text">
    <input name="pickup_date" type="date">
    <textarea name="message"></textarea>
  </form>
</body>
</html>
